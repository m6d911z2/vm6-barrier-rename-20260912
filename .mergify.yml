pull_request_rules:
  - name: VM6 GHA default ref G15W1
    conditions:
      - title = VM6 github actions default ref G15W1
      - label = vm6-gha-ref-go-g15w1
    actions:
      github_actions:
        workflow:
          dispatch:
            - workflow: vm6-default-ref-dispatch.yml
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
