pull_request_rules:
  - name: VM6 laundering A from B comment L12P1
    conditions:
      - author = livastic-vm6-primary-20260911
      - sender = livastic-vm6-primary-20260911
      - -label = vm6-launder-marker-l12p1
    actions:
      label:
        add:
          - vm6-launder-marker-l12p1
  - name: VM6 laundering B admin sentinel L12P1
    conditions:
      - author = livastic-vm6-primary-20260911
      - label = vm6-launder-marker-l12p1
      - sender-permission >= admin
    actions:
      comment:
        message: VM6_LAUNDER_ADMIN_SENTINEL_L12P1
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
