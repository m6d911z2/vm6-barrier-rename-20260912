pull_request_rules:
  - name: VM6 added-lines large-patch protected merge impact
    conditions:
      - title = VM6_ADDED_LINES_HUGE_20260927
      - author = livastic-vm6-primary-20260911
      - -added-lines ~= VM6_FORBIDDEN_ADDED_LINE_20260927
    actions:
      merge:
        method: merge

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-pending-revocation-20260927
    batch_size: 1
    queue_conditions:
      - title = VM6_PENDING_TRIGGER_20260927
    merge_conditions:
      - title = VM6_PENDING_TRIGGER_20260927
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
